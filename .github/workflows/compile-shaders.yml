name: Compile MonoGame Shaders

on:
  push:
    paths:
      - 'Content/**/*.fx'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  compile:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install MGFXC Tool
        run: dotnet tool install -g dotnet-mgfxc --version 3.8.1.303

      - name: Compile HLSL Shaders
        shell: pwsh
        run: |
          Get-ChildItem -Path Content/*.fx | ForEach-Object {
            $output = "Content/" + $_.BaseName + ".mgfx"
            Write-Host "Compiling $($_.FullName) -> $output"
            mgfxc $_.FullName $output /profile:OpenGL
          }

      - name: Commit and Push Compiled .mgfx Binaries
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-compile HLSL shaders to .mgfx [skip ci]"
          file_pattern: 'Content/*.mgfx'